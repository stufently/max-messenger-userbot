services:
  userbot:
    build: .
    image: max-userbot:dev
    container_name: max-userbot
    # `user:` здесь больше нет намеренно. Образ работает от пользователя `maxub`
    # (UID 10001) и владеет `/data` — этого довольно, пока данные лежат в named
    # volume ниже: Docker создаёт его по правам каталога из образа. Прежняя
    # строка `user: "1003:1003"` прошивала UID конкретной машины, и на любой
    # другой файлы оказывались чужими.
    #
    # Если данные нужны в каталоге репозитория, UID задаёт хост, и образу он не
    # подчиняется — тогда раскомментируйте строку ниже вместе с bind-mount в
    # разделе volumes. Значения подставляются из окружения:
    # `UID=$(id -u) GID=$(id -g) docker compose up -d`.
    # user: "${UID}:${GID}"
    environment:
      MAXUB_DATA_DIR: /data
      # Только петля внутри контейнера: на 0.0.0.0 демон был бы доступен любому
      # соседнему контейнеру в общей сети Docker, а не только `compose exec`.
      MAXUB_HOST: 127.0.0.1
      MAXUB_PORT: "8765"
      # Заглушка по умолчанию: она никуда не ходит и не трогает живой аккаунт,
      # а значит `compose up` в незнакомом окружении безопасен. Библиотека
      # реального транспорта в образе есть (см. Dockerfile), поэтому
      # переключение на `pymax` — правка одной этой строки, без пересборки.
      MAXUB_TRANSPORT: stub
      MAXUB_LOG_LEVEL: info
    volumes:
      - maxub-data:/data
      # Вариант с каталогом рядом с кодом — вместо строки выше, вместе с `user:`:
      # - ./data:/data
    restart: unless-stopped
    # Порт наружу не публикуется: демон управляет живыми аккаунтами. В таком
    # виде доступен только `docker compose exec`, а веб-панель — нет.
    #
    # Чтобы открыть панель, раскомментируйте обе строки ниже и замените выше
    # MAXUB_HOST на 0.0.0.0 (иначе проброс упрётся в петлю внутри контейнера).
    # Публикация именно на 127.0.0.1 хоста: порт виден только с самой машины,
    # с других — туннелем `ssh -L 8765:127.0.0.1:8765 <хост>`.
    # Цена решения: демон становится виден и соседям по сети compose, защищает
    # его только токен.
    # ports:
    #   - "127.0.0.1:8765:8765"

# Том, а не каталог репозитория: в нём лежат токен и БД с сессиями, и права на
# него не зависят от того, какой UID у пользователя на этой машине. Удаляется
# вместе с данными: `docker compose down -v`.
volumes:
  maxub-data:
