# Релиз по тегу: колесо, sdist и автономный Windows-exe в GitHub Release.
#
# Сборка exe не повторяется здесь заново, а вызывается как переиспользуемый
# workflow: спека и список скрытых импортов PyInstaller живут в одном месте
# (packaging/windows/maxub.spec), и второй экземпляр шагов сборки со временем
# разошёлся бы с тем, что проверяют обычные прогоны.
name: release

# Ручного запуска нет намеренно: единственный источник номера версии — тег,
# а при запуске с ветки сверять было бы нечего.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Релизный прогон не отменяется на полпути: наполовину опубликованный релиз
# хуже, чем ожидание.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Тег совпадает с версией пакета
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # Явный интерпретатор, а не системный: `tomllib` появился только в 3.11,
        # а версия системного python на образе раннера может смениться.
        #
        # Номер — тот же, что `PRIMARY_PYTHON` в ci.yml. Передать переменную
        # между workflow нечем (`env` одного не виден другому), поэтому число
        # написано здесь заново, а совпадение сторожит job `versions` в ci.yml:
        # ровно так этот файл уже отстал на 3.12, когда остальное ушло вперёд.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Compare tag with pyproject version
        # Версия пакета живёт только в pyproject.toml. Если тег и версия
        # разойдутся, релиз уедет под чужим номером, а колесо внутри него
        # будет называться иначе — чинить это потом придётся удалением релиза,
        # поэтому проверка стоит первой и блокирует остальные работы.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              sys.exit(f"тег {tag!r} не начинается с 'v'")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag[1:] != version:
              sys.exit(f"тег {tag!r} не совпадает с версией пакета {version!r} в pyproject.toml")
          print(f"тег {tag} соответствует версии {version}")
          PY

  dists:
    name: Колесо и sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Та же версия, что выше и что `PRIMARY_PYTHON` в ci.yml. Колесо
          # получается чистым `py3-none-any`, то есть от версии сборщика не
          # зависит, — но зависит окружение, в котором hatchling его собирает,
          # и держать его отличным от проверенного незачем.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packaging/constraints.txt

      # Колесо и sdist отсюда уезжают в релиз, то есть это сборка дистрибутива,
      # а не проверка: версии закреплены файлом ограничений. Тем же файлом
      # закреплён и hatchling, который ставится в изолированное окружение
      # сборки, — от его версии зависит содержимое колеса.
      #
      # Тот же `python -m build` в ci.yml намеренно идёт без ограничений: там он
      # играет роль раннего предупреждения (подробности в шапке ci.yml).
      - name: Install build backend
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build wheel and sdist
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dists
          path: dist/*
          if-no-files-found: error

  windows:
    name: Автономный exe
    needs: version
    # Тот же workflow, что гоняется на обычных пушах, — релизный exe собирается
    # ровно тем же способом, каким его уже проверяли. Артефакт `maxub-windows`
    # он выкладывает сам, и в пределах одного прогона его забирает job publish.
    uses: ./.github/workflows/windows-build.yml

  image:
    name: Образ в GHCR
    needs: version
    runs-on: ubuntu-latest
    # `packages: write` — только этой работе: остальным публиковать нечего.
    # `contents: read` указан явно, потому что блок `permissions` на уровне
    # работы обнуляет всё, что в нём не перечислено, — без этой строки не
    # сработал бы даже checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ни `docker/*`-actions, ни buildx, ни binfmt: образ собирается штатным
      # `docker build`, а публикуется штатным `docker push`. Архитектура одна
      # (amd64) и второй не будет — решение записано в TASKS.md, — так что
      # buildx не даёт здесь ничего, кроме третьей стороны в цепочке поставки.
      # На arm64 остаётся колесо из этого же релиза, ставящееся через `pipx`:
      # оно `py3-none-any`.
      #
      # Имя владельца берётся из окружения и приводится к нижнему регистру:
      # в GHCR имена только строчные, а `github.repository_owner` сохраняет
      # регистр как в профиле.
      - name: Build the image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/max-userbot"
          docker build --build-arg EXTRAS=pymax -t "${image}:${version}" .
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Smoke-test the image before publishing
        # Порядок здесь и есть смысл шага: `docker push` уже выкладывает образ,
        # и проверка после него ничего не предотвращает. Отправляются ровно те
        # байты, что проверены, — между проверкой и отправкой пересборки нет.
        run: bash packaging/docker/smoke.sh "${IMAGE}:${VERSION}"

      - name: Log in to GHCR
        # Токен идёт в docker login через stdin, а не аргументом: аргументы
        # видны в списке процессов и оседают в истории оболочки.
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        # Точная версия — чтобы можно было закрепиться намертво; минорная — чтобы
        # получать исправления внутри неё; latest — для тех, кому нужно просто
        # «последнее».
        #
        # Плавающие теги двигает только выпуск вида X.Y.Z. Триггер этого workflow
        # — `tags: ["v*"]`, то есть `v0.3.0rc1` тоже сюда попадёт, и без проверки
        # предвыпуск увёл бы за собой и `0.3`, и `latest`: тот, кто ничего не
        # просил, получил бы release candidate. Сам предвыпуск при этом
        # публикуется под своей точной версией — забрать его можно, наступить
        # случайно нельзя.
        run: |
          set -euo pipefail
          tags=("$VERSION")
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              tags+=("${VERSION%.*}" latest)
          else
              echo "$VERSION — предвыпуск: плавающие теги не двигаются"
          fi
          for tag in "${tags[@]}"; do
              docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${tag}"
              docker push "${IMAGE}:${tag}"
          done
          docker logout ghcr.io

  publish:
    name: Публикация релиза
    # Образа в списке нет намеренно. Файлы релиза (колесо, sdist, exe) не
    # зависят от реестра, а публикация в GHCR зависит от настроек пакета,
    # которые задаются в веб-интерфейсе руками: первая отправка создаёт пакет
    # приватным. Свяжи их — и заминка в настройках реестра задержала бы выпуск
    # файлов, которым реестр не нужен. Отказ работы `image` виден по красному
    # прогону и лечится перезапуском именно этой работы на том же теге, без
    # выпуска нового.
    needs: [dists, windows]
    runs-on: ubuntu-latest
    # Право на запись выдаётся только этой работе: сборка обходится чтением, а
    # создать релиз может лишь один шаг ниже.
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dists
          path: release

      - name: Download Windows executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maxub-windows
          path: release

      - name: List release files
        run: ls -l release

      - name: Create GitHub Release
        # `gh` предустановлен на раннере; сторонний action ради одной команды
        # добавил бы в цепочку поставки лишнего поставщика.
        #
        # Имя тега и репозитория идут через env, а не подставляются в текст
        # команды: подстановка `${{ }}` разворачивается до запуска shell, и имя
        # тега — то есть строка, которую задаёт человек, — стало бы частью
        # команды. Через переменную окружения оно остаётся данными.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "$TAG_NAME" \
            --generate-notes \
            release/*
