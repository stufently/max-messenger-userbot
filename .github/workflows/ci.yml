# Основной прогон проверок: линтер, типы, тесты, образ и колесо.
#
# Проверки те же, что гоняются вручную в Docker, — расхождение между «локально
# зелено» и «в CI зелено» стоит дороже, чем лишняя работа в матрице.
#
# Про версии зависимостей здесь принято отдельное решение: проверки идут на
# плавающих версиях, сборка дистрибутива — на закреплённых.
#
# В packaging/constraints.txt лежат точные версии, и подключить их к job-ам
# ниже было бы технически несложно. Сделано намеренно иначе. Задача этого
# workflow — не воспроизвести прошлое, а узнать о поломке раньше пользователя:
# в pyproject объявлены нижние границы (`fastapi>=0.115`), значит любой новый
# релиз зависимости пользователь получит сразу, а мы — только если где-то
# ставим без ограничений. Закрепив версии везде, мы получили бы вечно зелёный
# CI и узнавали бы о несовместимости из отчётов о багах. Поэтому `static`,
# `tests` и `package` ставят зависимости свободно и играют роль раннего
# предупреждения; красный прогон при неизменившемся коде здесь — это сигнал, а
# не помеха.
#
# Воспроизводимая сторона при этом не остаётся непроверенной: job `docker`
# собирает корневой Dockerfile, а он закреплён и по digest базового образа, и
# по версиям из файла ограничений, — то есть ровно тот путь, которым получается
# артефакт, проверяется в каждом прогоне.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# По умолчанию токену нужно только чтение кода: ни один job здесь ничего не
# публикует и не пишет в репозиторий.
permissions:
  contents: read

# Пуш поверх пуша в ту же ветку отменяет предыдущий прогон: результат старого
# коммита всё равно никому не нужен, а минуты раннера расходуются.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия, на которой собирается рабочий образ, — она же основная для проверок,
  # которые не размножаются по матрице.
  PRIMARY_PYTHON: "3.14"

jobs:
  static:
    name: Линтер и типы
    runs-on: ubuntu-latest
    steps:
      # Все actions закреплены по SHA, а не по тегу: тег в чужом репозитории
      # можно переставить на другой коммит, и в прогон приедет чужой код.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
          # Ключ кэша считается по объявлению зависимостей, а не по
          # packaging/constraints.txt: этот job ставит зависимости свободно (см.
          # шапку файла), и закреплённые версии на его установку не влияют.
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        # Без ограничений — намеренно, объяснение в шапке файла.
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        # Форматирование проверяется отдельно от правил: спор о переносах не
        # должен выглядеть как ошибка в коде.
        run: ruff format --check .

      - name: mypy
        # Область типизации ровно та же, что в pyproject: пакет `maxub`, без
        # тестов. Расширять её здесь нельзя — CI разошёлся бы с локальным
        # прогоном.
        run: mypy src/maxub

  tests:
    name: Тесты (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — нижняя граница из `requires-python`, 3.14 — версия рабочего
        # образа и релизного exe. Между ними 3.12 и 3.13: они больше нигде не
        # закреплены, но объявленный контракт `>=3.11` обещает работу и на них,
        # а необещанного здесь нет — версии ниже 3.11 не проверяются вовсе.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        # Без ограничений — намеренно, объяснение в шапке файла. Матрица версий
        # Python и свободный выбор версий зависимостей — это и есть та проверка,
        # которую закреплённый набор дать не может.
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: pytest
        # Вывод дублируется в файл: следующий шаг достаёт из него текст падения
        # и кладёт в аннотацию, потому что сами логи прогона читаются только
        # администратором репозитория — подробности в скрипте.
        # `-o pipefail` обязателен: без него код возврата дал бы `tee`, и
        # красный pytest выглядел бы зелёным шагом. Код сохраняется в файл, а не
        # выводится: отчёт привязан именно к нему, чтобы аварийные исходы
        # (сборка не собралась, интерпретатор упал, тесты не собрались) тоже
        # попадали в аннотацию.
        run: |
          set -o pipefail
          status=0
          python -m pytest -q -rf --tb=short --color=no 2>&1 \
            | tee "${RUNNER_TEMP}/pytest.log" || status=$?
          printf '%s\n' "$status" >"${RUNNER_TEMP}/pytest.status"
          exit "$status"

      - name: Падения тестов — в аннотацию и сводку
        if: failure()
        run: |
          bash .github/scripts/report-pytest-failures.sh \
            "Тесты (py${{ matrix.python-version }})" \
            "${RUNNER_TEMP}/pytest.log" "${RUNNER_TEMP}/pytest.status"

  docker:
    name: Образ и тесты внутри него
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Собирается штатным `docker build` без docker/*-actions: образ никуда не
      # публикуется, а лишний внешний action — лишняя зависимость в цепочке
      # поставки.
      #
      # Это закреплённая половина прогона: Dockerfile берёт базовый образ по
      # digest и версии из packaging/constraints.txt. Если закреплённый набор
      # перестанет ставиться или тесты на нём перестанут проходить, видно будет
      # здесь.
      - name: Build image
        run: docker build -t max-userbot:ci .

      - name: Run tests inside the image
        # Корневой Dockerfile не копирует `tests/` (в образе для пользователя
        # им нечего делать), поэтому каталог подкидывается монтированием — так
        # проверяется ровно тот установленный пакет, который получает
        # пользователь, а не исходники из рабочей копии.
        # `-p no:cacheprovider` — чтобы pytest не пытался писать .pytest_cache
        # в примонтированный только для чтения каталог.
        run: |
          set -o pipefail
          status=0
          docker run --rm \
            -v "$PWD/tests:/app/tests:ro" \
            -w /app \
            -e MAXUB_DATA_DIR=/tmp/data \
            max-userbot:ci \
            python -m pytest -q -rf --tb=short --color=no -p no:cacheprovider 2>&1 \
            | tee "${RUNNER_TEMP}/pytest-image.log" || status=$?
          printf '%s\n' "$status" >"${RUNNER_TEMP}/pytest-image.status"
          exit "$status"

      - name: Check the real transport is inside the image
        # Тесты этого не поймают: они подменяют библиотеку транспорта фейком,
        # чтобы адаптер проверялся без сети и без аккаунта, — и остаются
        # зелёными, даже если настоящей библиотеки в образе нет. А выбирается
        # транспорт переменной окружения уже после сборки, доставить пакет в
        # запущенный контейнер нечем. Так что отсутствие всплыло бы у
        # пользователя при первом же `MAXUB_TRANSPORT=pymax`.
        run: |
          docker run --rm \
            -e MAXUB_DATA_DIR=/tmp/data \
            max-userbot:ci \
            python -c "from maxub.transport import get_factory; t = get_factory('pymax')(); print(t.name, t.capabilities.send_text)"

      # Публикуемый образ отличается от проверенного выше одним аргументом
      # (`EXTRAS=pymax` вместо `dev,pymax`), и этого достаточно, чтобы он повёл
      # себя иначе: pytest внутри есть у одного и нет у другого. Собирается он
      # здесь на каждом пуше, а не только по тегу, — иначе поломка публикуемой
      # формы обнаруживалась бы в момент релиза, когда её меньше всего ждут.
      - name: Build the published image shape
        run: docker build --build-arg EXTRAS=pymax -t max-userbot:release .

      - name: Smoke-test the published image
        # Тот же скрипт, что запускает release.yml перед публикацией: демон
        # поднимается, healthcheck зеленеет, токен выдаётся — и это проверяется
        # на named volume и на bind-mount с UID хоста, потому что оба способа
        # описаны в README и ведут себя по-разному.
        run: bash packaging/docker/smoke.sh max-userbot:release

      - name: The published image carries no development tools
        # Иначе `EXTRAS` мог бы тихо перестать действовать (например, после
        # правки строки установки), и пользователи получали бы образ с pytest,
        # mypy и ruff внутри.
        run: |
          docker run --rm max-userbot:release python - <<'PY'
          import importlib.util as util
          import sys

          missing = [name for name in ("pymax", "httpx") if util.find_spec(name) is None]
          extra = [name for name in ("pytest", "mypy", "ruff") if util.find_spec(name) is not None]
          if missing:
              sys.exit(f"в публикуемом образе нет обязательного: {', '.join(missing)}")
          if extra:
              sys.exit(f"в публикуемом образе лишнее из dev: {', '.join(extra)}")
          print("состав публикуемого образа верный")
          PY

      # В конце job-а, а не сразу после тестов: шаг с `if: failure()` в середине
      # выполнился бы только при падении именно предыдущих шагов, а падения
      # тестов надо показать при любом порядке отказов. Скрипт сам молчит, если
      # тесты прошли, а упало что-то после них.
      - name: Падения тестов в образе — в аннотацию и сводку
        if: failure()
        run: |
          bash .github/scripts/report-pytest-failures.sh \
            "Тесты в образе" \
            "${RUNNER_TEMP}/pytest-image.log" "${RUNNER_TEMP}/pytest-image.status"

  versions:
    name: Версии Python согласованы
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python versions agree across workflows and images
        # Версия Python прошита в семи местах, и передать её между ними нечем:
        # `env` одного workflow не виден другому, базовый образ закреплён по
        # digest, `setup-python` требует литерал, а каталог установки под Wine —
        # часть пути Windows. Значит, совпадение нужно сторожить: при обновлении
        # до 3.14 два номера в release.yml так и остались на 3.12 и нашлись
        # только на ревью, то есть случайно.
        #
        # Где сверяется точная версия, а где только минор — не единообразно, и
        # это осознанно. Сборка exe под Wine и на раннере обязана идти одним
        # интерпретатором, там сравнивается патч. У образа Docker патч выбирает
        # тег (`3.14-slim` — это движущийся 3.14.x), и требовать там совпадения
        # значило бы завести проверку, которую придётся отключить при первом же
        # обновлении образа.
        #
        # `PRIMARY_PYTHON` берётся из env всего workflow — того же значения, что
        # получают шаги `setup-python` выше.
        run: |
          set -euo pipefail
          fail=0
          bad() { echo "$1" >&2; fail=1; }
          # Каждое значение вынимается по своей форме, а не «числом, похожим на
          # версию»: иначе проверка нашла бы номер в соседнем комментарии и
          # сравнивала бы текст сама с собой.
          winfile=packaging/windows/Dockerfile
          image_minor="$(sed -n 's/^# python:\([0-9]\+\.[0-9]\+\)-slim.*$/\1/p' Dockerfile)"
          exe_version="$(sed -n 's/^ARG PYTHON_VERSION=\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' "$winfile")"
          exe_dir="$(sed -n 's/^ARG PYTHON_DIR="C:\\\\Python\([0-9]\+\)"$/\1/p' "$winfile")"
          runner_version="$(sed -n 's/^ *python-version: "\([0-9.]\+\)"$/\1/p' .github/workflows/windows-build.yml)"
          mapfile -t release_versions < <(
              sed -n 's/^ *python-version: "\([0-9.]\+\)"$/\1/p' .github/workflows/release.yml)
          matrix="$(sed -n 's/^ *python-version: \(\[.*\]\)$/\1/p' .github/workflows/ci.yml)"

          # Пустое значение значит, что форма в файле изменилась, — это отказ, а
          # не «проверять нечего»: молчаливо переставшая проверять проверка хуже
          # отсутствующей, её зелёному верят. Проверяется в основной оболочке, а
          # не внутри подстановки: `fail=1`, выставленный в подоболочке, пропал бы.
          require() {
              [ -n "$2" ] || bad "не найдено: $1 — проверка перестала проверять"
          }
          require "тег базового образа (Dockerfile)" "$image_minor"
          require "ARG PYTHON_VERSION ($winfile)" "$exe_version"
          require "ARG PYTHON_DIR ($winfile)" "$exe_dir"
          require "python-version (windows-build.yml)" "$runner_version"
          require "матрица тестов (ci.yml)" "$matrix"

          echo "основная версия: $PRIMARY_PYTHON"
          echo "образ: $image_minor, exe: $exe_version (каталог Python$exe_dir," \
               "раннер $runner_version), release.yml: ${release_versions[*]-нет}"
          echo "матрица: $matrix"

          [ "$image_minor" = "$PRIMARY_PYTHON" ] \
              || bad "базовый образ: $image_minor, ожидалось $PRIMARY_PYTHON"
          [ "${exe_version%.*}" = "$PRIMARY_PYTHON" ] \
              || bad "интерпретатор exe: $exe_version, ожидался $PRIMARY_PYTHON.x"
          # Патч, а не минор: windows-build.yml обещает, что exe с раннера и exe,
          # собранный локально под Wine, — одна и та же сборка Python.
          [ "$runner_version" = "$exe_version" ] \
              || bad "раннер собирает exe на $runner_version, образ под Wine — на $exe_version"
          # Каталог установки вычисляется из версии, а не сверяется со списком:
          # так проверка не требует правки при следующем обновлении.
          expected_dir="$(printf '%s' "${exe_version%.*}" | tr -d .)"
          [ "$exe_dir" = "$expected_dir" ] \
              || bad "каталог C:\\Python$exe_dir не соответствует версии $exe_version"

          # Число вхождений, а потом значения: `sort -u` сам по себе пропустил бы
          # исчезновение одной из двух строк — оставшаяся совпала бы с ожиданием,
          # и молчание проверки означало бы, что колесо собирается неизвестно чем.
          if [ "${#release_versions[@]}" -ne 2 ]; then
              bad "в release.yml ожидались ровно два python-version (проверка тега и сборка колеса), найдено ${#release_versions[@]}"
          fi
          for version in ${release_versions[@]+"${release_versions[@]}"}; do
              [ "$version" = "$PRIMARY_PYTHON" ] \
                  || bad "release.yml: $version, ожидалось $PRIMARY_PYTHON"
          done

          # Матрица не сравнивается с основной версией — она нарочно шире, — но
          # основная версия обязана в ней быть: иначе то, на чём собираются
          # артефакты, тестами не покрыто.
          printf '%s' "$matrix" | grep -Fq "\"$PRIMARY_PYTHON\"" \
              || bad "в матрице тестов нет основной версии $PRIMARY_PYTHON"

          if [ "$fail" -eq 0 ]; then
              echo "версии согласованы"
          fi
          exit "$fail"

  winbuild-base:
    name: Сборочный образ Windows согласован
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Base image digest matches the Debian snapshot
        # В packaging/windows/Dockerfile два входа, обязанных соответствовать
        # друг другу: digest базового образа и дата снимка snapshot.debian.org,
        # из которого ставится Wine. Сам Dockerfile это и проверяет — но при
        # сборке, а её здесь нет: релизный exe собирается нативно на
        # windows-latest, и образ под Wine в CI не строится вовсе. То есть
        # обновление одного digest-а (а Dependabot двигает именно его и только
        # его) прошло бы все проверки зелёным и сломало бы локальную сборку у
        # того, кто следующим её запустит.
        #
        # Образ не запускается: файл достаётся `docker cp` из созданного, но не
        # стартовавшего контейнера. Проверке нужно только содержимое, а команда
        # внутри чужого образа — лишнее доверие на ровном месте.
        run: |
          set -euo pipefail
          dockerfile=packaging/windows/Dockerfile
          mapfile -t images < <(sed -n 's/^FROM \(debian@sha256:[0-9a-f]\{64\}\)$/\1/p' "$dockerfile")
          # Дата снимка разбирается по форме, а не «всё после знака равенства»:
          # иначе пустое или битое значение прошло бы дальше и попало в шаблон
          # поиска, где часть символов значит не себя.
          mapfile -t snapshots < <(sed -n 's/^ARG DEBIAN_SNAPSHOT=\([0-9]\{8\}T[0-9]\{6\}Z\)$/\1/p' "$dockerfile")
          # Ноль совпадений означал бы, что проверка молча перестала проверять,
          # а несколько — что она сверяет не то, что попадёт в сборку.
          if [ "${#images[@]}" -ne 1 ] || [ "${#snapshots[@]}" -ne 1 ]; then
            echo "в $dockerfile ожидались ровно один FROM debian@sha256: и один ARG DEBIAN_SNAPSHOT," >&2
            echo "найдено: образов ${#images[@]}, снимков ${#snapshots[@]}" >&2
            exit 1
          fi
          image="${images[0]}"
          snapshot="${snapshots[0]}"
          echo "образ $image, снимок $snapshot"
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          # Во временный каталог, а не в рабочую копию: проверка не должна
          # оставлять за собой файлов в дереве репозитория.
          sources="${RUNNER_TEMP:-/tmp}/debian.sources"
          docker cp "$container:/etc/apt/sources.list.d/debian.sources" "$sources"
          # Обе записи, как и в самом Dockerfile: security-снимок живёт отдельной
          # строкой и разъезжается независимо.
          for archive in debian debian-security; do
            if ! grep -Fq -- "archive/$archive/$snapshot" "$sources"; then
              echo "ARG DEBIAN_SNAPSHOT=$snapshot расходится с базовым образом;" >&2
              echo "в образе записано:" >&2
              grep -F snapshot.debian.org "$sources" >&2
              exit 1
            fi
          done
          echo "digest и снимок согласованы"

  package:
    name: Колесо и статика веб-панели
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build backend
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Check web panel assets are inside the wheel
        # Статика не импортируется кодом, поэтому её пропажу из сборки не
        # поймает ни один тест: установленный пакет молча отдаст 404 на панель.
        # Сравнение идёт с содержимым каталога в репозитории — так проверка
        # переживёт добавление новых файлов панели.
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile
          from pathlib import Path

          static_dir = Path("src/maxub/api/static")
          expected = {
              f"maxub/api/static/{p.name}"
              for p in static_dir.iterdir()
              if p.suffix in {".html", ".css", ".js"}
          }
          if not expected:
              sys.exit("в src/maxub/api/static нет файлов панели — проверять нечего")

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = sorted(expected - names)
          if missing:
              sys.exit(f"в колесе {wheel} нет файлов панели: {missing}")
          print(f"{wheel}: статика на месте ({len(expected)} файлов)")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dists
          path: dist/*
          if-no-files-found: error
