# Релизный exe собирается нативно на Windows, а не под Wine.
#
# Wine в контейнере нужен, чтобы собрать сборку с Linux-машины разработчика, но
# артефакт для пользователей должен собираться тем же способом, каким его будут
# запускать: у Wine свои особенности (нереализованные функции WinAPI, чужой
# загрузчик), и расхождение обнаружилось бы уже у пользователя. Спека при этом
# одна и та же — packaging/windows/maxub.spec.
name: windows-build

on:
  push:
    branches: [main]
  # Релизный workflow вызывает эту сборку как переиспользуемую и забирает
  # артефакт в пределах своего прогона. Отдельного запуска по тегу здесь нет:
  # иначе один и тот же exe собирался бы дважды.
  workflow_call:
  pull_request:
    paths:
      - "packaging/windows/**"
      # Версии для сборки exe приходят отсюда. Без этой строки правка пина
      # проверялась бы только после слияния в main — то есть ошибку в закреплении
      # ловил бы уже релиз.
      - "packaging/constraints.txt"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Поколение ОС закреплено, а не взято по `windows-latest`. Метка `latest`
    # переезжает на следующий Windows Server сама, без правки в репозитории: в
    # день переезда релизный exe собрался бы в другой системе, и узнали бы об
    # этом по отчёту пользователя, а не из diff-а. Отказ «label not found» после
    # снятия образа с поддержки (GitHub держит два GA-образа и предупреждает
    # заранее) — плохой день, но починка в одну строку и в известном месте.
    #
    # Чего это НЕ закрепляет: сам образ раннера GitHub обновляет примерно
    # раз в неделю, и `windows-2025` — это поколение системы, а не её состояние.
    # Полное закрепление системной части возможно только на собственном раннере
    # с закреплённой VM-образом; для проекта такой ценой оно не стоит. Поэтому
    # незакреплённое хотя бы записывается: шаг ниже кладёт рядом с exe
    # `build-env.txt` с версией образа раннера и составом окружения сборки, и
    # файл уезжает в релиз вместе с артефактом.
    runs-on: windows-2025
    # Весь текст в проекте русский, а Windows-Python, чей вывод уходит в пайп (а
    # на раннере он уходит именно туда), берёт кодировку из ANSI-кодовой
    # страницы системы. У раннера GitHub это cp1252, куда кириллица не
    # переводится вовсе, — и любое сообщение по-русски заканчивалось не текстом,
    # а `UnicodeEncodeError`. Так и падал прогон: ошибку печатала проверка ниже,
    # причём на строке об успехе.
    #
    # Сама проверка защищена от этого изнутри (`check_bundle.py` перенастраивает
    # свой вывод), но по-русски говорит не только она: спека печатает отказ,
    # когда в окружении сборки нет библиотеки транспорта, и без этой переменной
    # вместо объяснения пользователь увидел бы ошибку кодировки.
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # Только официальные actions/*, версия закреплена по SHA: тег может быть
      # переставлен на другой коммит, и в сборку приедет чужой код.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Та же версия, что зафиксирована в packaging/windows/Dockerfile:
          # сборки под Wine и на раннере должны совпадать по интерпретатору.
          python-version: "3.14.6"

      - name: Install project and build tools
        # Версии закреплены файлом ограничений: это релизный артефакт, и его
        # состав не должен зависеть от того, что вышло на PyPI в день сборки.
        # Номер версии PyInstaller здесь не пишется — он живёт в том же файле,
        # что и версии для сборки под Wine, иначе два числа разъезжаются.
        # `PIP_BUILD_CONSTRAINT` — чтобы ограничения дошли и до изолированного
        # окружения, в котором собирается колесо проекта.
        #
        # Extra `pymax` ставится, хотя в pyproject он необязательный: PyInstaller
        # кладёт в exe то, что нашёл в окружении сборки, а в готовый one-file
        # ничего доставить уже нельзя. Без этой группы релизный exe отличался бы
        # от собранного под Wine (там тот же список приходит из
        # packaging/windows/requirements.py) — и отличался бы именно транспортом.
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[pymax]"
          python -m pip install pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/windows/maxub.spec

      - name: Show artifacts
        run: Get-ChildItem dist

      - name: Check the transport library is inside the exe
        # Что именно проверяется и почему этого не видно по успешной сборке —
        # в самом скрипте. Здесь он вызывается файлом, а не heredoc-ом: ровно
        # ту же проверку выполняет локальная сборка под Wine, и разъехаться они
        # не должны.
        #
        # bash, а не PowerShell по умолчанию: PowerShell перекодирует вывод
        # вызванной программы по кодовой странице консоли, и русский текст в
        # журнале превратился бы в кашу; bash отдаёт байты как есть.
        shell: bash
        run: python packaging/windows/check_bundle.py dist/maxub.exe dist/maxubctl.exe

      - name: The exe starts and speaks Russian
        # Что именно проверяется и почему запуск не заменяется разбором архива —
        # в самом скрипте. Он же вызывается локальной сборкой под Wine.
        #
        # Запускается только `maxubctl.exe`: `maxub.exe` собран без консоли и
        # без аргументов — он поднимает демон и открывает браузер, то есть на
        # раннере это не проверка, а зависший процесс. Общая часть у них одна
        # (тот же пакет, тот же набор зависимостей), и разворачивается она в
        # обоих одинаково.
        #
        # Ограничение по времени — шагом, а не скриптом: в Git Bash на раннере
        # нет `timeout`, а зависший загрузчик иначе занимал бы раннер до общего
        # лимита job.
        timeout-minutes: 5
        shell: bash
        run: bash packaging/windows/smoke_run.sh ./dist/maxubctl.exe

      - name: Record the build environment
        # Системная часть сборки не закреплена и закреплена быть не может (см.
        # комментарий к `runs-on`), поэтому она хотя бы записывается: без этого
        # файла про выпущенный exe нельзя сказать, в какой системе и с какими
        # версиями он собран, — журнал прогона живёт 90 дней, а релиз остаётся.
        #
        # Состав окружения берётся у самого pip, а не переписывается из
        # packaging/constraints.txt: файл ограничений говорит, что просили, а
        # `pip freeze` — что действительно встало.
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "коммит: ${GITHUB_SHA}"
            echo "прогон: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "образ раннера: ${ImageOS:-неизвестно} ${ImageVersion:-неизвестно}"
            echo "интерпретатор: $(python -VV)"
            echo "pyinstaller: $(python -m PyInstaller --version)"
            echo
            echo "--- pip freeze ---"
            python -m pip freeze
          } > dist/build-env.txt
          cat dist/build-env.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxub-windows
          # `build-env.txt` перечислен рядом с exe намеренно: release.yml
          # забирает этот артефакт целиком и выкладывает его содержимое в
          # релиз — то есть запись о среде сборки лежит там же, где сам файл, и
          # живёт столько же. Комментарий стоит здесь, а не внутри списка: `|` —
          # это литеральный блок, и строка с решёткой внутри него стала бы одним
          # из шаблонов пути.
          path: |
            dist/maxub.exe
            dist/maxubctl.exe
            dist/build-env.txt
          if-no-files-found: error
