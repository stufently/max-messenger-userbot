# Релизный exe собирается нативно на Windows, а не под Wine.
#
# Wine в контейнере нужен, чтобы собрать сборку с Linux-машины разработчика, но
# артефакт для пользователей должен собираться тем же способом, каким его будут
# запускать: у Wine свои особенности (нереализованные функции WinAPI, чужой
# загрузчик), и расхождение обнаружилось бы уже у пользователя. Спека при этом
# одна и та же — packaging/windows/maxub.spec.
name: windows-build

on:
  push:
    branches: [main]
  # Релизный workflow вызывает эту сборку как переиспользуемую и забирает
  # артефакт в пределах своего прогона. Отдельного запуска по тегу здесь нет:
  # иначе один и тот же exe собирался бы дважды.
  workflow_call:
  pull_request:
    paths:
      - "packaging/windows/**"
      # Версии для сборки exe приходят отсюда. Без этой строки правка пина
      # проверялась бы только после слияния в main — то есть ошибку в закреплении
      # ловил бы уже релиз.
      - "packaging/constraints.txt"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Только официальные actions/*, версия закреплена по SHA: тег может быть
      # переставлен на другой коммит, и в сборку приедет чужой код.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Та же версия, что зафиксирована в packaging/windows/Dockerfile:
          # сборки под Wine и на раннере должны совпадать по интерпретатору.
          python-version: "3.13.14"

      - name: Install project and build tools
        # Версии закреплены файлом ограничений: это релизный артефакт, и его
        # состав не должен зависеть от того, что вышло на PyPI в день сборки.
        # Номер версии PyInstaller здесь не пишется — он живёт в том же файле,
        # что и версии для сборки под Wine, иначе два числа разъезжаются.
        # `PIP_BUILD_CONSTRAINT` — чтобы ограничения дошли и до изолированного
        # окружения, в котором собирается колесо проекта.
        #
        # Extra `pymax` ставится, хотя в pyproject он необязательный: PyInstaller
        # кладёт в exe то, что нашёл в окружении сборки, а в готовый one-file
        # ничего доставить уже нельзя. Без этой группы релизный exe отличался бы
        # от собранного под Wine (там тот же список приходит из
        # packaging/windows/requirements.py) — и отличался бы именно транспортом.
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/packaging/constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[pymax]"
          python -m pip install pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/windows/maxub.spec

      - name: Show artifacts
        run: Get-ChildItem dist

      - name: Check the transport library is inside the exe
        # Успешная сборка сама по себе ничего не доказывает: exe без транспорта
        # выглядит ровно так же и весит почти столько же, а упрётся в
        # `ModuleNotFoundError` только у пользователя, выбравшего
        # `MAXUB_TRANSPORT=pymax`, — то есть там, где доложить недостающее
        # нечем. Отказ спеки (`SystemExit`) закрывает лишь случай «библиотеки в
        # окружении сборки нет вовсе»; здесь проверяется то, что важно на самом
        # деле, — что в архив попал ВЕСЬ пакет, а не сколько-то его модулей.
        #
        # Сравнение с установленным пакетом, а не со списком имён: список
        # устарел бы при первом же обновлении библиотеки и начал бы врать в
        # обратную сторону — молча пропускать пропажу новых модулей.
        #
        # bash, а не PowerShell по умолчанию: на раннере он есть, а heredoc
        # избавляет от экранирования кавычек внутри YAML.
        shell: bash
        run: |
          python - dist/maxub.exe dist/maxubctl.exe <<'PY'
          import importlib
          import os
          import pkgutil
          import sys
          import tempfile

          from PyInstaller.archive.readers import CArchiveReader, ZlibArchiveReader

          PACKAGE = "pymax"
          module = importlib.import_module(PACKAGE)
          on_disk = {PACKAGE} | {
              name for _, name, _ in pkgutil.walk_packages(module.__path__, PACKAGE + ".")
          }

          for exe in sys.argv[1:]:
              reader = CArchiveReader(exe)
              # Чистый Python лежит не в самом архиве exe, а во вложенном PYZ:
              # искать `pymax` в `reader.toc` бесполезно, там только бинарники
              # и данные.
              pyz = next(name for name in reader.toc if name.lower().endswith(".pyz"))
              path = os.path.join(tempfile.gettempdir(), "maxub-pyz-check.pyz")
              with open(path, "wb") as handle:
                  handle.write(reader.extract(pyz))
              bundled = set(ZlibArchiveReader(path).toc)
              missing = sorted(on_disk - bundled)
              if missing:
                  sys.exit(f"{exe}: в сборке не хватает модулей {PACKAGE}: {missing}")
              print(f"{exe}: {PACKAGE} целиком, {len(on_disk)} модулей")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxub-windows
          path: |
            dist/maxub.exe
            dist/maxubctl.exe
          if-no-files-found: error
