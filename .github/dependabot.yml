# Всё закреплённое здесь закреплено намеренно: actions — по SHA, базовые образы
# — по digest, версии зависимостей — файлом ограничений. Плата за это —
# зависимости, которые никто не поднимает вручную; Dependabot и есть та сторона,
# которая их поднимает, иначе закрепление превращается в вечно устаревший набор
# с известными дырами.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      # Короткий заголовок в повелительном наклонении — как принято в проекте.
      prefix: Update

  # Базовые образы закреплены по digest, а digest не переезжает сам вместе с
  # тегом: без этого блока обновления безопасности в python и debian просто
  # проходят мимо сборки.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/packaging/windows"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: Update

  # Точные версии из packaging/constraints.txt. Обновления сюда приходят
  # предложениями, а не автоматически: файл описывает набор, на котором собран
  # выпущенный дистрибутив, и менять его молча нельзя.
  - package-ecosystem: pip
    directory: "/packaging"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: Update
    # Одним предложением на весь файл, а не по пакету за раз. Ограничения
    # осмысленны только целиком: набор проверяется сборкой и тестами вместе, и
    # разбитый на пять PR он проверяется пять раз по частям, ни разу — в том
    # виде, в котором поедет в релиз.
    groups:
      constraints:
        patterns:
          - "*"
    ignore:
      # Отдельно от остальных не двигается никогда: pydantic требует свою
      # core-часть точной версией (`pydantic-core==2.46.4` у pydantic 2.13.4),
      # и поднятый в одиночку pydantic-core делает набор неустанавливаемым —
      # такой PR обречён быть вечно красным.
      #
      # Дырой в безопасности это не становится: новую core-часть всё равно не
      # получить иначе как через выпуск самого pydantic. Когда он выйдет,
      # Dependabot предложит его, а номер core-части в этом же PR нужно
      # выставить руками — по метаданным нового pydantic.
      - dependency-name: pydantic-core
