[project]
name = "max-userbot"
version = "0.1.0"
description = "Юзербот для мессенджера MAX (Макс, max.ru): автоматизация пользовательских аккаунтов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "fastapi>=0.115",
    "qrcode>=8",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
maxub = "maxub.cli.main:cli"
maxubctl = "maxub.cli.main:ctl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Depends() в значениях по умолчанию — штатная идиома FastAPI, не ошибка.
"src/maxub/api/routes/*.py" = ["B008"]
# В тестах блокирующие проверки файлов и собственные ожидания допустимы.
"tests/*" = ["ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["maxub"]

[[tool.mypy.overrides]]
# У qrcode нет типовых заглушек; используется одна функция отрисовки.
module = ["qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
