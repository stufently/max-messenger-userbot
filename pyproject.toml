[project]
name = "max-userbot"
version = "0.1.0"
description = "Юзербот для мессенджера MAX (Макс, max.ru): автоматизация пользовательских аккаунтов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=43",
    "fastapi>=0.115",
    "qrcode>=8",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Транспорт к реальному MAX. Необязателен намеренно: без него платформа
# работает на заглушке, а верхняя граница стоит потому, что адаптер опирается
# на устройство публичных моделей PyMax, а не только на имена методов.
pymax = ["maxapi-python>=2.3.1,<2.4"]
# Ключ шифрования в Secret Service (GNOME Keyring, KWallet). В Windows DPAPI
# зовётся через ctypes и зависимости не требует, а без этого extra ключ просто
# остаётся в файле рядом с базой — штатный путь для контейнера.
keyring = ["keyring>=25"]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
maxub = "maxub.cli.main:cli"
maxubctl = "maxub.cli.main:ctl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxub"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Depends() в значениях по умолчанию — штатная идиома FastAPI, не ошибка.
"src/maxub/api/routes/*.py" = ["B008"]
# В тестах блокирующие проверки файлов и собственные ожидания допустимы.
"tests/*" = ["ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["maxub"]

[[tool.mypy.overrides]]
# У qrcode нет типовых заглушек; используется одна функция отрисовки.
module = ["qrcode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMax — необязательная зависимость: адаптер обязан собираться и без неё.
# Обращения к библиотеке и так идут через Any.
#
# `follow_imports = skip` обязателен, а не для порядка. Библиотека теперь стоит
# в образе, и без него mypy заходит внутрь её исходников и падает там на
# синтаксисе — проверка своего кода срывается из-за чужого. Чужой код мы не
# типизируем ни при каком раскладе, поэтому смотреть внутрь незачем.
module = ["pymax.*", "pymax"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
